<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030713">
<title>El,ai | ELHAM STUDIOS</title>

<style>
:root {
  --bg: #030713;
  --panel: #0a1223;
  --blue: #2589ff;
  --cyan: #65e5ff;
  --text: #edf5ff;
  --muted: #8b9ab5;
  --border: rgba(105, 165, 255, .16);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100dvh;
  background:
    radial-gradient(ellipse at 50% 15%, #102653 0%, transparent 38%),
    linear-gradient(180deg, #030713, #050a17 60%, #030713);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  overflow: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .17;
  background-image:
    linear-gradient(rgba(71,133,230,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(71,133,230,.12) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
}

.app {
  width: 100%;
  max-width: 760px;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 17px 19px;
  border-bottom: 1px solid var(--border);
  background: rgba(3, 7, 19, .65);
  backdrop-filter: blur(18px);
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: 800;
  color: white;
  background: linear-gradient(140deg, #37baff, #2547e9 65%, #111a53);
  box-shadow: 0 0 25px #1679ff55;
}

.brand { flex: 1; min-width: 0; }

.brand h1 {
  font-size: 19px;
  letter-spacing: 1px;
  margin: 0;
}

.brand p {
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 2px;
  margin: 4px 0 0;
}

.status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: #a9f6d0;
}

.dot {
  width: 7px;
  height: 7px;
  background: #51f6a7;
  border-radius: 50%;
  box-shadow: 0 0 10px #51f6a7;
}

main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.hero {
  flex-shrink: 0;
  text-align: center;
  padding: 8px 0 2px;
  position: relative;
}

.orb-stage {
  width: 210px;
  height: 166px;
  margin: 0 auto;
  position: relative;
  display: grid;
  place-items: center;
  perspective: 600px;
}

.orb-glow {
  position: absolute;
  width: 116px;
  height: 116px;
  border-radius: 50%;
  background: #087dff;
  filter: blur(48px);
  opacity: .44;
  animation: breathe 4s ease-in-out infinite;
}

.planet {
  width: 86px;
  height: 86px;
  position: relative;
  z-index: 2;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 28% 22%, #d9ffff 0%, #75eaff 7%,
      #258cff 27%, #1250c8 51%, #071640 82%);
  box-shadow:
    inset -12px -8px 22px #01091e,
    inset 5px 4px 16px #c0f7ff,
    0 0 24px #198bffbb,
    0 0 70px #087dff55;
  animation: planetFloat 5s ease-in-out infinite;
}

.planet::after {
  content: "";
  position: absolute;
  inset: 8px 12px 52px 14px;
  border-radius: 50%;
  background: #ffffff9c;
  filter: blur(7px);
}

.ring {
  position: absolute;
  width: 176px;
  height: 60px;
  left: 50%;
  top: 50%;
  margin-left: -88px;
  margin-top: -30px;
  border: 3px solid transparent;
  border-radius: 50%;
  transform-style: preserve-3d;
  pointer-events: none;
}

.ring-one {
  border-top-color: #8cecff;
  border-left-color: #379dff;
  border-right-color: #2c69e9;
  transform: rotate(-24deg) rotateX(67deg);
  box-shadow: 0 -3px 9px #42b9ff66;
  animation: ringGlow 3s ease-in-out infinite;
}

.ring-two {
  width: 195px;
  height: 79px;
  margin-left: -97px;
  margin-top: -39px;
  border-top-color: #e4faff;
  border-bottom-color: #246cff;
  transform: rotate(47deg) rotateX(67deg);
  opacity: .9;
}

.ring-three {
  width: 159px;
  height: 92px;
  margin-left: -79px;
  margin-top: -46px;
  border-left-color: #58c5ff;
  border-bottom-color: #5e80ff;
  transform: rotate(105deg) rotateX(63deg);
  opacity: .75;
}

.ring-four {
  width: 184px;
  height: 66px;
  margin-left: -92px;
  margin-top: -33px;
  border-right-color: #b1f5ff;
  border-bottom-color: #2779ff;
  transform: rotate(-65deg) rotateX(72deg);
  opacity: .65;
}

@keyframes breathe {
  50% { transform: scale(1.22); opacity: .68; }
}

@keyframes planetFloat {
  50% { transform: translateY(-4px); }
}

@keyframes ringGlow {
  50% { filter: brightness(1.7); }
}

.hero h2 {
  font-size: 21px;
  letter-spacing: 1.5px;
  margin: -1px 0 4px;
}

.hero .tagline {
  margin: 0;
  color: var(--muted);
  font-size: 12px;
}

.chat {
  flex: 1;
  min-height: 80px;
  overflow-y: auto;
  padding: 12px 16px 18px;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: #253b62 transparent;
}

.message {
  display: flex;
  margin: 10px 0;
  animation: appear .25s ease-out;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.message.user { justify-content: flex-end; }

.bubble {
  max-width: 88%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 16px 16px 16px 4px;
  background: rgba(13, 25, 47, .92);
  font-size: 14px;
  line-height: 1.55;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user .bubble {
  background: linear-gradient(135deg, #1459bc, #173c82);
  border-color: #408dff55;
  border-radius: 16px 16px 4px 16px;
}

.bubble strong { color: #80dfff; }

.typing {
  color: var(--cyan);
  font-size: 12px;
  letter-spacing: 1px;
  padding: 8px 14px;
}

.quick-actions {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 9px 15px;
  scrollbar-width: none;
}

.quick-actions::-webkit-scrollbar { display: none; }

.quick-actions button {
  flex-shrink: 0;
  padding: 8px 12px;
  color: #c5d9f9;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: #0a1427;
  font-size: 11px;
}

.composer-wrap {
  padding: 8px 13px calc(12px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent, #030713 25%);
}

.composer {
  display: flex;
  align-items: flex-end;
  gap: 9px;
  padding: 8px;
  border: 1px solid #24436d;
  border-radius: 20px;
  background: rgba(9, 19, 37, .96);
  box-shadow: 0 0 28px #006bff0d;
}

#messageInput {
  flex: 1;
  min-width: 0;
  max-height: 110px;
  resize: none;
  padding: 9px 5px;
  border: 0;
  outline: none;
  color: white;
  background: transparent;
  font: inherit;
  font-size: 14px;
}

#messageInput::placeholder { color: #7183a2; }

#sendButton {
  flex-shrink: 0;
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 14px;
  color: white;
  background: linear-gradient(135deg, #29baff, #2856ee);
  font-size: 21px;
  box-shadow: 0 0 18px #1679ff44;
}

#sendButton:disabled {
  opacity: .45;
}

.footer {
  text-align: center;
  color: #657592;
  font-size: 10px;
  padding: 10px 0 0;
  letter-spacing: .3px;
}

button { cursor: pointer; }
button:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
}

@media (min-width: 600px) {
  .hero { padding-top: 14px; }
  .orb-stage { height: 185px; }
  .chat { padding-left: 28px; padding-right: 28px; }
}
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="logo">E</div>
    <div class="brand">
      <h1>El,ai</h1>
      <p>ELHAM STUDIOS</p>
    </div>
    <div class="status">
      <span class="dot"></span>
      <span id="connectionStatus">Connecting</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="orb-stage" aria-label="Animated blue planet with glowing rings">
        <div class="orb-glow"></div>
        <div class="ring ring-one"></div>
        <div class="ring ring-two"></div>
        <div class="ring ring-three"></div>
        <div class="ring ring-four"></div>
        <div class="planet"></div>
      </div>
      <h2>AT YOUR SERVICE, BOSS</h2>
      <p class="tagline">Your ideas. Your vision. Your AI.</p>
    </section>

    <section class="chat" id="chat" aria-live="polite">
      <div class="message">
        <div class="bubble">
          Welcome back, Boss. I'm <strong>El,ai</strong>, created by ELHAM STUDIOS.
          <br><br>
          What are we working on today?
        </div>
      </div>
    </section>

    <div class="quick-actions">
      <button type="button" data-prompt="Introduce yourself and explain what you can do.">Meet El,ai</button>
      <button type="button" data-prompt="Teach me something useful about artificial intelligence.">Learn AI</button>
      <button type="button" data-prompt="Help me plan my priorities for today.">Plan my day</button>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea
          id="messageInput"
          rows="1"
          maxlength="8000"
          placeholder="Ask El,ai anything, Boss..."
          aria-label="Your message"
          required
        ></textarea>
        <button id="sendButton" type="submit" aria-label="Send message">➤</button>
      </form>
      <div class="footer">EL,AI · POWERED BY ELHAM STUDIOS</div>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  const API_BASE = "https://elai-backend.onrender.com";
  const chat = document.getElementById("chat");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const statusText = document.getElementById("connectionStatus");

  let busy = false;

  function addMessage(text, role) {
    const row = document.createElement("div");
    row.className = "message " + role;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop = chat.scrollHeight;
    return row;
  }

  async function checkConnection() {
    try {
      const response = await fetch(API_BASE + "/health");
      const data = await response.json();

      if (!response.ok) throw new Error("Backend unavailable");

      statusText.textContent = data.ai_configured ? "AI Online" : "Key Missing";
      statusText.style.color = data.ai_configured ? "#a9f6d0" : "#ffcc7a";
    } catch {
      statusText.textContent = "Offline";
      statusText.style.color = "#ff9caa";
    }
  }

  async function sendMessage(message) {
    if (busy || !message.trim()) return;

    busy = true;
    sendButton.disabled = true;
    input.disabled = true;

    addMessage(message.trim(), "user");
    input.value = "";

    const typing = addMessage("El,ai is thinking...", "assistant");
    typing.querySelector(".bubble").classList.add("typing");

    try {
      const response = await fetch(API_BASE + "/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message.trim() })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || "The AI request failed.");
      }

      typing.querySelector(".bubble").textContent =
        data.reply || "Sorry, Boss. I received an empty response.";

      statusText.textContent = "AI Online";
      statusText.style.color = "#a9f6d0";
    } catch (error) {
      typing.querySelector(".bubble").textContent =
        "Sorry, Boss. I couldn't get a reply. " +
        (error.message || "Check your internet connection and try again.");

      statusText.textContent = "Request Failed";
      statusText.style.color = "#ff9caa";
    } finally {
      busy = false;
      sendButton.disabled = false;
      input.disabled = false;
      input.focus();
      chat.scrollTop = chat.scrollHeight;
    }
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    sendMessage(input.value);
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 110) + "px";
  });

  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      form.requestSubmit();
    }
  });

  document.querySelectorAll("[data-prompt]").forEach(button => {
    button.addEventListener("click", () => {
      sendMessage(button.dataset.prompt);
    });
  });

  checkConnection();
})();
</script>
</body>
</html>
